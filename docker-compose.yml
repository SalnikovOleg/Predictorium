services:
  nginx:
    image: nginx:alpine
    container_name: predictum-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php-app:/var/www/html        # Исходники PHP
      - ./react-app/build:/var/www/frontend  # Сборка React
    depends_on:
      - backend
    networks:
      - app-network

  # Backend: PHP-FPM
  backend:
    build: ./php-app
    container_name: predictum-backend
    volumes:
      - ./php-app:/var/www/html
    networks:
      - app-network

  # Frontend: React (Node.js)
  frontend:
    build: ./react-app
    container_name: predictum-frontend
    volumes:
      - ./react-app:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - CHOKIDAR_USEPOLLING=true

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: predictum-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - app-network

  # Database: MySQL
  db:
    image: mysql:8.0
    container_name: predictum-mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: my_database
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: